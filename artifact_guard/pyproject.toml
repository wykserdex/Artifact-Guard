[project]
name = "artifact-guard"
version = "0.1.0"
description = "Secure artifact analyzer for URLs, domains, files, and PII leaks"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.25.0",
    "aiohttp>=3.9.0",
    "playwright>=1.40.0",
    "redis>=5.0.0",
    "asyncpg>=0.29.0",
    "cryptography>=41.0.0",
    "python-jose[cryptography]>=3.3.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "structlog>=24.1.0",
    "pillow>=10.0.0",
    "python-multipart>=0.0.6",
    "alembic>=1.13.0",
    "sqlalchemy[asyncio]>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",
    "faker>=22.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared", "domain", "ingress", "policy", "analysis", "renderer", "scoring", "evidence", "storage", "broker", "api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
