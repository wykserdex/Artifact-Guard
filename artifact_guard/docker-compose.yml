version: "3.9"

services:
  api:
    build: .
    command: uvicorn api.app:app --host 0.0.0.0 --port 8000
    environment:
      - REDIS_HOST=redis
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/artifact_guard
      - LOG_LEVEL=INFO
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-change-me-in-production-32b}
    depends_on:
      - redis
      - postgres
    networks:
      - internal
    restart: unless-stopped

  worker:
    build: .
    command: python -m main
    environment:
      - REDIS_HOST=redis
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/artifact_guard
      - LOG_LEVEL=INFO
      - ENABLE_ACTIVE_ANALYSIS=true
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-change-me-in-production-32b}
    depends_on:
      - redis
      - postgres
    networks:
      - internal
    restart: unless-stopped

  renderer:
    build: ./renderer
    command: python -m renderer.worker
    environment:
      - HTTP_PROXY=http://egress-proxy:8080
      - HTTPS_PROXY=http://egress-proxy:8080
      - NO_PROXY=""
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev
      - /home/worker:size=64m,nosuid,nodev
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.0
    networks:
      - analysis_egress
    restart: "no"

  egress-proxy:
    image: squid/squid:latest
    volumes:
      - ./docker/squid.conf:/etc/squid/squid.conf:ro
    networks:
      - internal
      - analysis_egress
    ports:
      - "8080:8080"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - internal
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=artifact_guard
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:
    driver: bridge
    internal: false  # Allows access to Redis and Postgres
  analysis_egress:
    driver: bridge
    internal: true  # Renderer can only reach egress-proxy

volumes:
  redis_data:
  postgres_data:
